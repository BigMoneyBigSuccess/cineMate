syntax = "proto3";

package proto;

option go_package = "./;proto";

service AnalyticsService {
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
}

message GetUserStatsRequest {
  int64 user_id = 1;
}

message GenreStat {
  string genre = 1;
  int32 count = 2;
}

message ActorStat {
  string actor = 1;
  int32 count = 2;
}

message GetUserStatsResponse {
  int32 watched_movies = 1;
  repeated GenreStat genres = 2;
  repeated ActorStat favorite_actors = 3;
}
