syntax = "proto3";

package social.v1;

option go_package = "github.com/BigMoneyBigSuccess/cineMate/proto/social/socialv1;socialv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service SocialService {
  rpc CreateProfile(CreateProfileRequest) returns (google.protobuf.Empty);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (google.protobuf.Empty);

  rpc FollowUser(FollowUserRequest) returns (google.protobuf.Empty);
  rpc UnfollowUser(UnfollowUserRequest) returns (google.protobuf.Empty);
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);
  rpc IsFollowing(IsFollowingRequest) returns (IsFollowingResponse);

}

message CreateProfileRequest {
  string user_id  = 1;
  string username = 2;
}

message UserProfile {
  string user_id                   = 1;
  string username                  = 2;
  string bio                       = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserProfile profile = 1;
}

message UpdateProfileRequest {
  string username = 1;
  string bio      = 2;
}

message FollowUserRequest {
  string followed_id = 1;
}

message UnfollowUserRequest {
  string followed_id = 1;
}

message GetFollowersRequest {
  string user_id = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}

message GetFollowersResponse {
  repeated string follower_ids = 1;
  int32           total        = 2;
}

message GetFollowingRequest {
  string user_id = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}

message GetFollowingResponse {
  repeated string following_ids = 1;
  int32           total         = 2;
}

message IsFollowingRequest {
  string follower_id = 1;
  string followed_id = 2;
}

message IsFollowingResponse {
  bool is_following = 1;
}

