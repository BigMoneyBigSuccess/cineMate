version: '3.8'

services:
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
    depends_on:
      - auth-service
      - collections-service
    networks:
      - cineMate

networks:
  cineMate:
    name: cineMate-network
